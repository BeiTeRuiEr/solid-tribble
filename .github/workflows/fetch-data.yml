name: Fetch data & deploy Pages

on:
  push:
    branches: [main] # push 到 main 即自动部署(改 site/ 不用再手动 Run)
  # 每小时那条仍保持停用(2026-10-14 用户要求),但**必须**保留下面这条每天一次的:
  # 底部趋势图只依赖 daily.json(「门店每日数据」),而 daily 模式的判定窗口是
  # UTC 18:00~18:09 = 北京时间 02:00~02:09 —— 这个时段 cron-job.org 不会触发
  # (它只在北京时间 08:00~23:00 跑),所以这条 daily 只能由 GitHub 内置调度器来跑。
  # 停用它的实测后果:2026-10-14 之后 daily 模式一次都没触发过,
  # 趋势图数据停在 2026年10月13日,落后 2 天。
  schedule:
    - cron: '0 18 * * *' # 每天一次抓每日业绩(UTC 18:00 = 北京 02:00,此时前一天已结算完整)
  # 如需恢复每小时刷新,再把下面这条取消注释(注意它会让 main 模式每小时多跑一次):
  #   - cron: '12 * * * *'    # 每 1 小时一次,每小时第 12 分
  workflow_dispatch:
    inputs:
      mode:
        description: '抓取模式：auto=按运行时刻自动判定(默认) / main=只刷新实时数据 / daily=只刷新每日业绩(趋势图)'
        type: choice
        default: auto
        options: [auto, main, daily] # 手动补跑入口（2026-10-15 加：趋势图落后时可在此强制抓 daily）
        # ⚠ 默认值必须是 auto：实测 cron 触发的运行也会带着 inputs 的默认值进来，
        #   如果默认值不是 auto，daily 定时任务会被误判成别的模式。

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # 应急开关:平时留空。需要在仓库 Settings → Secrets and variables → Actions → Variables
  # 临时加一个 FETCH_MODE_OVERRIDE=main|daily|both,就能强制下一次运行抓什么,不用改代码。
  MODE_OVERRIDE: ${{ vars.FETCH_MODE_OVERRIDE }}

concurrency:
  group: pages
  # 2026-10-23 改 true:本仓库是 5 分钟一次的高频抓取,false 会让排队越积越长 ——
  # 前一次卡在 Install deps 时,后面每次触发都进 pending,而新触发又会把旧 pending 顶掉,
  # 表现为 Actions 页面永远有一条 Pending 卡着、永远轮不到(实测 #5096/#5097 被 cancelled)。
  # 高频抓取只关心最新一次,旧运行直接让位,队列永远不会堆积。
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 必须给超时:2026-10-07 那次 deploy job 卡在 waiting 状态整整 5 天,
    # 一直占着下面的 pages 并发组,导致之后 39 次定时运行全被取消(看板断更)。
    # 加了超时后,卡住的 job 最多拖 X 分钟就会自己失败,不再堵住后面的运行。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip # 缓存 pip 下载,省几秒
          cache-dependency-path: scripts/requirements.txt

      # 2026-10-23 删除 actions/cache 的 Playwright 浏览器缓存(用户要求:不读任何缓存)。
      # 说明:这个 cache 只存 ~/.cache/ms-playwright 里的 chromium 二进制,不含任何 BI 数据/
      # Cookie/profile(脚本每次 tempfile.mkdtemp() 新建空 profile),它不影响数据新鲜度;
      # 但去掉后行为更确定 —— 每次都是当天新鲜的浏览器与全新环境。

      # 判定本次抓什么(要提前知道,才能决定装不装浏览器):
      # 不用 github.event_name / github.event.schedule 判断:实测本仓库的定时(cron)运行
      # 被 GitHub 报成 workflow_dispatch,inputs 还会被填上默认值,导致每次都跑成 both,
      # 降频完全失效。改成看 runner 的 UTC 时间,简单且确定。
      #   UTC 18:00~18:09(北京 02:00)→ daily:只抓「门店每日数据」1 张表
      #   其它时间                    → main :只抓主页面 6 张表,不碰 daily.json
      # 「门店每日数据」是全表最大(307 行,约占 7 表总量 62%),而曲线只需要它的历史点
      # (今日点已改由门店表「今日业绩」列实时提供,随每小时一刷更新),所以降到每天一次。
      # ── 为什么还要看分钟 ──
      # 只看小时的话,18 点这一小时内所有定时触发(含 18:12 的每小时那次)都会被判成 daily,
      # 主页面 6 张表在 02:00~03:00 就一次都不抓,出现一小时空档。加「分钟 < 10」限定,
      # 只有 UTC 18:00 那条 cron 走 daily,18:12 照常抓 main。
      - name: Detect fetch mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          H=$((10#$(date -u +%H)))
          MIN=$((10#$(date -u +%M)))
          # 优先级：手动指定的 inputs.mode > 仓库变量 > 按 UTC 时刻自动判定。
          # ⚠ 判空要用「非 main/daily 就走自动判定」，不能写成「空 → main」：
          #   cron-job.org 是**不带 inputs** POST 触发 dispatch 的，GitHub 会给它
          #   填上默认值 auto。若把 auto 误判成 main，等于废掉凌晨的 daily 定时任务。
          if [ "$INPUT_MODE" = "main" ] || [ "$INPUT_MODE" = "daily" ]; then
            M="$INPUT_MODE"
          elif [ -n "$MODE_OVERRIDE" ]; then
            M="$MODE_OVERRIDE"
          elif [ "$H" -eq 18 ] && [ "$MIN" -lt 10 ]; then
            M=daily
          else
            M=main
          fi

          # ── daily 陈旧兜底（2026-10-20）────────────────────────────────
          # 上面那条内置 cron 在本仓库经常不触发（10-14 停过 4 天，10-18 之后又停了 2 天），
          # 结果 daily.json 停在 10-18 10:34：18 号只有当天上午的半天（0.83 万）、
          # 19 号整条 0，趋势图末尾看起来像业绩掉到 0，实际是数据没抓到。
          # 兜底：main 模式先读 daily.json 的 updated_at，超过 20 小时就本次一并抓 daily(=both)。
          # 抓成功后 updated_at 立刻变新，后续运行自然不再触发，不会反复抓大表。
          # 限流：只在每小时 :00~:04 那次运行自动补，避免 daily 抓取失败时每 5 分钟重试；
          #       但 push 触发的那次不受限（改代码时顺手把数据补齐）。
          if [ "$M" = "main" ]; then
            STALE=$(python3 scripts/daily_age.py 20)
            echo "daily 检查：${STALE#*|}"
            if [ "${STALE%%|*}" = "stale" ] && { [ "$MIN" -lt 5 ] || [ "$GITHUB_EVENT_NAME" = "push" ]; }; then
              M=both
              echo "→ daily.json 已过期，本次连同每日业绩一起抓（FETCH_MODE=both）"
            fi
          fi

          echo "FETCH_MODE=$M" >> "$GITHUB_ENV"
          echo "UTC=$(date -u +%H:%M) input='${INPUT_MODE}' override='${MODE_OVERRIDE}' → FETCH_MODE=$M"

      - name: Install deps
        # 必须单独封顶:不给这步设超时,apt/下载一卡就会一直占着 pages 并发组直到 build 的
        # 20 分钟总超时,期间所有定时触发全部作废(2026-10-23 事故就是卡在这一步)。
        timeout-minutes: 8
        run: |
          pip install -r scripts/requirements.txt
          # 浏览器必须常装(2026-10-13 起):main 模式虽然只做接口重放,但每次都要先开一次
          # 浏览器重抓模板 —— BI 把结果缓存在「抓模板时的报表实例」上,重放旧模板永远是旧快照
          # (实测数字能落后好几小时)。
          # 2026-10-23:先不带 --with-deps 装。--with-deps 每次都要 apt-get update/install,
          # 是这次卡 10+ 分钟的元凶;ubuntu-latest 镜像本身已带 chromium 所需系统库,
          # 不带 deps 只做下载(约 15~25 秒),真缺库才回退走 apt。全程不读任何缓存。
          playwright install chromium || playwright install --with-deps chromium

      - name: Fetch tables
        id: fetch
        continue-on-error: true # 失败不直接判死,给 fallback 一个装浏览器重试的机会
        # 2026-10-23 加:这步是纯网络 IO(登录 + 重抓模板 + 取数),正常约 60~90 秒。
        # 没有超时的话,BI 侧不响应会一直挂着,把 pages 并发组占死。
        timeout-minutes: 8
        env:
          BI_USER: ${{ secrets.BI_USER }}
          BI_PASS: ${{ secrets.BI_PASS }}
        run: |
          # 新方案:重放 BI 自己的 action=req 接口(模板在 scripts/bi_session.json) —— 比老方案
          # (开浏览器读 DOM,约 145 秒)快得多,也不受虚拟滚动影响、不漏行。
          # 但每次都要先花约 20~30 秒重抓一次模板:BI 把结果缓存在抓模板时创建的报表实例上,
          # 重放旧模板只会拿到旧快照(2026-10-13 实测数字落后好几小时),详见脚本内注释。
          # daily 模式还会用当天的 URL 重抓每日业绩页(它的日期区间钉在实例上)。
          python scripts/fetch_data.py

      # 兜底:快路径失败(模板失效/取数缺表)时,装上浏览器完整重试一遍;
      # 重放方案失败再退回老方案 fetch_data_dom.py(读 DOM),保证看板不断数。
      - name: Fallback (install browser and retry)
        if: steps.fetch.outcome != 'success'
        timeout-minutes: 12   # 兜底路径要装 deps + 连跑两个脚本,但也不能无限拖
        env:
          BI_USER: ${{ secrets.BI_USER }}
          BI_PASS: ${{ secrets.BI_PASS }}
        run: |
          echo "快路径失败 → 安装浏览器后重试"
          playwright install --with-deps chromium
          python scripts/fetch_data.py || python scripts/fetch_data_dom.py

      # 把 8 张表合并成一个 bundle.json（2026-10-15）：
      # GitHub Pages 对「单个来源 IP 的请求速率」限流（实测 18 req/s 正常、171 req/s 返 429），
      # 而门店/办公室是同一个公网出口 IP。合并后单次打开的请求数 12 → 5，限流余量提升 2.4 倍。
      # 必须放在「Commit data」之前 —— 下面的 git add site/data/*.json 会把 bundle.json 一起提交。
      - name: Build data bundle
        run: python scripts/make_bundle.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # bi_session.json 也要提交:脚本重抓模板后会写回这里,提交后下次运行才能复用
          git add site/data/*.json scripts/bi_session.json
          git diff --cached --quiet || git commit -m "data: $FETCH_MODE update $(date -u +%F' '%H:%M)"
          # 两次运行可能前后脚完成:先 rebase 远端最新提交再推。
          # -X theirs = 冲突时采用本次运行的数据(rebase 中 theirs 指本运行的新提交):
          # 两次运行都整文件重写 JSON(含 updated_at),必然内容冲突,自动合并解不掉,
          # 必须显式给策略,否则 rebase 卡死整次运行失败。后完成者数据更新,以其为准。
          # 推送也可能被别人(比如我本地的一次 push)抢先:ref 锁冲突会让整次运行失败,
          # 所以重试 3 次,每次先 rebase 再推。
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            echo "第 $i 次推送失败,5 秒后重试"
            sleep 5
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 同上:别让 deploy 卡住堵死整个并发组
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
