name: Fetch data & deploy Pages

on:
  push:
    branches: [main] # push 到 main 即自动部署(改 site/ 不用再手动 Run)
  schedule:
    # 每 1 小时一次(每小时第 12 分,错开整点高峰,降低被 GitHub 调度器丢班次的概率)
    - cron: '12 * * * *'
    # 每天一次:只抓「门店每日数据」。cron 用 UTC —— 北京时间 02:00 = UTC 前一天 18:00。
    # 单独一条 cron 而不是独立 workflow:两条 workflow 共用并发组时,排队中的那条会被
    # 后来的挤掉(cancelled),凌晨这次很容易跑不起来;合并成一条就只有一种队列,不会被取消。
    - cron: '0 18 * * *'
  workflow_dispatch: {} # 手动补跑兜底(模式按运行时的 UTC 小时自动判定)

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # 应急开关:平时留空。需要在仓库 Settings → Secrets and variables → Actions → Variables
  # 临时加一个 FETCH_MODE_OVERRIDE=main|daily|both,就能强制下一次运行抓什么,不用改代码。
  MODE_OVERRIDE: ${{ vars.FETCH_MODE_OVERRIDE }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 必须给超时:2026-10-07 那次 deploy job 卡在 waiting 状态整整 5 天,
    # 一直占着下面的 pages 并发组,导致之后 39 次定时运行全被取消(看板断更)。
    # 加了超时后,卡住的 job 最多拖 X 分钟就会自己失败,不再堵住后面的运行。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip # 缓存 pip 下载,省几秒
          cache-dependency-path: scripts/requirements.txt

      # 缓存 Playwright 的 chromium(约160MB),命中后跳过下载,是提速大头
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      # 判定本次抓什么(要提前知道,才能决定装不装浏览器):
      # 不用 github.event_name / github.event.schedule 判断:实测本仓库的定时(cron)运行
      # 被 GitHub 报成 workflow_dispatch,inputs 还会被填上默认值,导致每次都跑成 both,
      # 降频完全失效。改成看 runner 的 UTC 时间,简单且确定。
      #   UTC 18:00~18:09(北京 02:00)→ daily:只抓「门店每日数据」1 张表
      #   其它时间                    → main :只抓主页面 6 张表,不碰 daily.json
      # 「门店每日数据」是全表最大(307 行,约占 7 表总量 62%),而曲线只需要它的历史点
      # (今日点已改由门店表「今日业绩」列实时提供,随每小时一刷更新),所以降到每天一次。
      # ── 为什么还要看分钟 ──
      # 只看小时的话,18 点这一小时内所有定时触发(含 18:12 的每小时那次)都会被判成 daily,
      # 主页面 6 张表在 02:00~03:00 就一次都不抓,出现一小时空档。加「分钟 < 10」限定,
      # 只有 UTC 18:00 那条 cron 走 daily,18:12 照常抓 main。
      - name: Detect fetch mode
        run: |
          H=$((10#$(date -u +%H)))
          MIN=$((10#$(date -u +%M)))
          if [ -n "$MODE_OVERRIDE" ]; then
            M="$MODE_OVERRIDE"
          elif [ "$H" -eq 18 ] && [ "$MIN" -lt 10 ]; then
            M=daily
          else
            M=main
          fi
          echo "FETCH_MODE=$M" >> "$GITHUB_ENV"
          echo "UTC=$(date -u +%H:%M) → FETCH_MODE=$M"

      - name: Install deps
        run: |
          pip install -r scripts/requirements.txt
          # 浏览器按需装:main 模式是纯接口重放,根本不开浏览器,装了也白装
          # (--with-deps 要 apt 装一堆系统库,固定 1 分多钟,runner 每次都是全新机器没法缓存)。
          # 只有 daily/both 模式(daily 页要重抓模板)才需要。main 模式万一模板失效,
          # 由下面 Fetch tables 的 fallback 步骤现装浏览器重试。
          if [ "$FETCH_MODE" != "main" ]; then
            echo "daily/both 模式 → 安装 Chromium"
            playwright install --with-deps chromium
          else
            echo "main 模式 → 跳过浏览器安装"
          fi

      - name: Fetch tables
        id: fetch
        continue-on-error: true # 失败不直接判死,给 fallback 一个装浏览器重试的机会
        env:
          BI_USER: ${{ secrets.BI_USER }}
          BI_PASS: ${{ secrets.BI_PASS }}
        run: |
          # 新方案:重放 BI 自己的 action=req 接口(模板在 scripts/bi_session.json),
          # 不用开浏览器/等渲染/滚滚动条,单次约 2 秒(老方案约 145 秒),且不漏行。
          # 例外:每日业绩页的日期区间是「抓模板那一刻」由页面 URL 上的 end_date 钉死的,
          # 重放改不动(2026-10-12 起日期不再出现在请求体里),所以 daily 模式会先花约 20 秒
          # 用当天的 URL 重抓一次该页模板再取数 —— 每天只跑一次,可以接受。
          python scripts/fetch_data.py

      # 兜底:快路径失败(模板失效/取数缺表)时,装上浏览器完整重试一遍;
      # 重放方案失败再退回老方案 fetch_data_dom.py(读 DOM),保证看板不断数。
      - name: Fallback (install browser and retry)
        if: steps.fetch.outcome != 'success'
        env:
          BI_USER: ${{ secrets.BI_USER }}
          BI_PASS: ${{ secrets.BI_PASS }}
        run: |
          echo "快路径失败 → 安装浏览器后重试"
          playwright install --with-deps chromium
          python scripts/fetch_data.py || python scripts/fetch_data_dom.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # bi_session.json 也要提交:脚本重抓模板后会写回这里,提交后下次运行才能复用
          git add site/data/*.json scripts/bi_session.json
          git diff --cached --quiet || git commit -m "data: $FETCH_MODE update $(date -u +%F' '%H:%M)"
          # 两次运行可能前后脚完成:先 rebase 远端最新提交再推。
          # -X theirs = 冲突时采用本次运行的数据(rebase 中 theirs 指本运行的新提交):
          # 两次运行都整文件重写 JSON(含 updated_at),必然内容冲突,自动合并解不掉,
          # 必须显式给策略,否则 rebase 卡死整次运行失败。后完成者数据更新,以其为准。
          # 推送也可能被别人(比如我本地的一次 push)抢先:ref 锁冲突会让整次运行失败,
          # 所以重试 3 次,每次先 rebase 再推。
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            echo "第 $i 次推送失败,5 秒后重试"
            sleep 5
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 同上:别让 deploy 卡住堵死整个并发组
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
